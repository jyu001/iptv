    function ensureReferenceChannels() { if(!all.some(c=>referenceCctvId(c)===5))all.push({id:'CCTV5.iptv345',name:'CCTV-5 (IPTV345)',group:'CCTV',logo:'',country:'CN',language:'zho',availability:'listed',url:'',reference:'https://iptv345.com/?act=play&tid=ys&id=5'}); if(!all.some(c=>c.id==='XianfengPingyu.iptv345'))all.push({id:'XianfengPingyu.iptv345',name:'先锋乒羽 (IPTV345 · unverified)',group:'Sports',logo:'',country:'CN',language:'zho',availability:'listed',url:'',reference:'https://iptv345.com/?act=play&tid=ty&id=16',iptv345Fallback:true}); }
    const PLAYLIST_CACHE='signal-iptv-playlist-v1'; let livePlaylistLoaded=false, cachedPlaylistLoaded=false, playlistCatalogReady=false;
    function useFallbackCatalog() { if(all.length)return; all=[...fallbackChannels(),...requestedFallbackChannels()];ensureReferenceChannels();els.updated.textContent='Starter catalog';enrich(); }
    function applyPlaylist(text,label) { all=parseM3U(text);ensureReferenceChannels();ensureRequestedChannels();els.updated.textContent=label;playlistCatalogReady=true;enrich(); }
    async function readPlaylistCache() { try { if(!('caches' in window))return null; const cache=await caches.open(PLAYLIST_CACHE), response=await cache.match(PLAYLISTS[0]); return response?await response.text():null; } catch { return null; } }
    async function writePlaylistCache(text) { try { if(!('caches' in window))return; const cache=await caches.open(PLAYLIST_CACHE); await cache.put(PLAYLISTS[0],new Response(text,{headers:{'Content-Type':'application/vnd.apple.mpegurl; charset=utf-8'}})); } catch {} }
    useFallbackCatalog(); els.updated.textContent='Starter catalog · loading live playlist…';
    readPlaylistCache().then(text=>{if(text&&!livePlaylistLoaded){cachedPlaylistLoaded=true;applyPlaylist(text,'Cached playlist · refreshing…');}});
    const playlistPromise=PLAYLISTS.reduce((promise,url)=>promise.catch(()=>fetchText(url)),Promise.reject()).then(async text=>{livePlaylistLoaded=true;applyPlaylist(text,'Live playlist');await writePlaylistCache(text);});
    playlistPromise.catch(()=>{playlistCatalogReady=true;useFallbackCatalog();els.updated.textContent=cachedPlaylistLoaded?'Cached playlist · live playlist unavailable':'Starter catalog · live playlist unavailable';if(document.body.dataset.view==='player')renderPlayerChannels();});
    const loadMetadata=()=>Promise.allSettled([fetchJson(API+'countries.json').then(data=>data.forEach(x=>countryMeta[x.code]=x)),fetchJson(API+'regions.json').then(data=>regionMeta=data),fetchJson(API+'streams.json').then(data=>data.forEach(x=>{if(x.channel&&x.url){const id=baseChannelId(x.channel);streamCounts[id]=(streamCounts[id]||0)+1;if(!streamUrls[id])streamUrls[id]=[];streamUrls[id].push(x.url);streamQuality[x.url]=parseInt(x.quality,10)||0;}}))]).then(()=>{if(all.length)enrich();});
    if('requestIdleCallback' in window)requestIdleCallback(loadMetadata,{timeout:3500});else setTimeout(loadMetadata,1000);
  </script>
